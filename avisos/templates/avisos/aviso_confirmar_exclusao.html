{% extends 'base.html' %}
{% block titulo %}Excluir aviso{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-4"><i class="bi bi-exclamation-triangle"></i> Excluir aviso</h1>

<p>Tem certeza que deseja excluir o aviso <strong>{{ aviso.titulo }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Excluir</button>
    <a href="{% url 'avisos:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
