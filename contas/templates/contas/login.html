{% extends 'base.html' %}
{% block titulo %}Entrar — Sistema Escolar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4"><i class="bi bi-mortarboard-fill"></i> Sistema Escolar</h1>

                {% if form.errors %}
                    <div class="alert alert-danger">Usuário ou senha inválidos.</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">Usuário</label>
                        <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
                        <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
