{% extends 'base.html' %}
{% block titulo %}Excluir horário{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-4"><i class="bi bi-exclamation-triangle"></i> Excluir horário</h1>

<p>Tem certeza que deseja excluir o horário <strong>{{ horario }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Excluir</button>
    <a href="{% url 'diario:horarios' %}?turma={{ horario.turma_id }}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
