{% extends 'base.html' %}
{% block titulo %}Lançar aula{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-4"><i class="bi bi-journal-plus"></i> Lançar aula</h1>

<form method="post" class="col-md-8">
    {% csrf_token %}
    {% for campo in form %}
    <div class="mb-3">
        <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
        {% for erro in campo.errors %}<div class="text-danger small">{{ erro }}</div>{% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Salvar e marcar presença</button>
</form>
{% endblock %}
